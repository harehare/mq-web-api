[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "Web API bindings for mq"
edition = "2024"
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query"]
license = "MIT"
name = "mq-web-api"
readme = "README.md"
repository = "https://github.com/harehare/mq-web-api"
version = "0.9.3"

[features]
default = ["use_mimalloc"]
use_mimalloc = ["mimalloc"]
otel = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry"]

[lints.rust]
missing_docs = "warn"

[dependencies]
axum = "0.8.8"
colored = "3.1.1"
miette = "7.6.0"
mimalloc = {version = "0.1.48", features = ["v3"], optional = true}
opentelemetry = {version = "0.33", optional = true}
opentelemetry-otlp = {version = "0.33", features = ["grpc-tonic"], optional = true}
opentelemetry_sdk = {version = "0.33", features = ["rt-tokio"], optional = true}
tracing-opentelemetry = {version = "0.34", optional = true}
mq-check = "0.9.3"
mq-formatter = {version = "0.9.3", default-features = false}
mq-help = {version = "0.9.3", default-features = false, features = ["catalog"]}
mq-hir = "0.9.3"
mq-lang = {version = "0.9.3", features = ["cst"]}
mq-lint = "0.9.3"
mq-markdown = {version = "0.9.3", features = ["json"]}
rayon = "1.11.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
sha2 = {version = "0.11.0"}
thiserror = "2.0.18"
tokio = {version = "1.52.2", features = ["full"]}
tower = "0.5.3"
tower-http = {version = "0.7.0", features = ["cors", "trace", "compression-gzip", "limit", "timeout"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter", "json"]}
utoipa = {version = "6.0", features = ["preserve_order"]}
utoipa-swagger-ui = {version = "10", features = ["axum", "vendored"]}

[dev-dependencies]
rstest = "0.27.0"

[[bin]]
name = "mq-web-api"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
